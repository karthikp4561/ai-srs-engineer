services:
  db:
    image: postgres:16-alpine
    container_name: srs_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ai_srs_engineer}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ai_srs_engineer}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - srs_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: srs_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-ai_srs_engineer}
      - SECRET_KEY=${SECRET_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-*}
    ports:
      - "8000:8000"
    networks:
      - srs_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: srs_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - srs_network

volumes:
  postgres_data:
    driver: local

networks:
  srs_network:
    driver: bridge
